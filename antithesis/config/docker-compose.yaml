name: dbdb

services:
  # Holds the driver binaries (linked against libdbdb.a) at /opt/antithesis/test/v1/main/
  # and sleeps until Antithesis runs them.
  drivers:
    image: ${REPOSITORY}/dbdb-drivers:latest
    container_name: dbdb-drivers
    hostname: dbdb-drivers
    platform: linux/amd64
    init: true
    environment:
      NO_COLOR: "1"
